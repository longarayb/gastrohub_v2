# Builds the production images and publishes them to the GitHub Container Registry
# (docs/PROPOSTA_HOSPEDAGEM.md, section 6). The server only pulls them (deploy/deploy.sh).
#
#   ghcr.io/<owner>/app-api:<commit>     ghcr.io/<owner>/app-web:<commit>
#   ghcr.io/<owner>/app-menu:<commit>    ghcr.io/<owner>/app-admin:<commit>
#
# No secret goes into the images: the panel, the menu and the admin call /api on their own
# address (NEXT_PUBLIC_* empty) and every setting comes from the server's .env when it runs.
name: images

on:
  push:
    # chore/hosting: the rehearsal on the new VM needs images before the stage is merged.
    # Remove it when chore/hosting is merged into main.
    branches: [main, chore/hosting]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: docker/api.Dockerfile
          - app: web
            dockerfile: docker/next.Dockerfile
          - app: menu
            dockerfile: docker/next.Dockerfile
          - app: admin
            dockerfile: docker/next.Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase owner)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/app-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_MENU_URL=
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
