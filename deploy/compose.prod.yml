# Production (docs/DEPLOY.md). Runs on the server from /opt/app:
#   docker compose -f compose.prod.yml --env-file .env up -d
# Normally through deploy/deploy.sh, which sets APP_VERSION, migrates first and checks health.
#
# PostgreSQL is NOT here: it runs on the VM itself (cluster in /mnt/dados), reached at the
# gateway of the app_net network (172.30.0.1). That network is created once by server-setup.sh
# (external), so `docker compose down` never removes the address Postgres listens on.
# Only Caddy publishes ports (80/443): Docker bypasses ufw for published ports.

x-image: &image-base
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }
  networks: [app_net]

services:
  # One-off: docker compose -f compose.prod.yml run --rm migrate  (deploy.sh does it)
  migrate:
    <<: *image-base
    image: ${IMAGE_PREFIX}/app-api:${APP_VERSION}
    restart: 'no'
    profiles: ['tools']
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      # The owner of the tables: only the migrations change the schema.
      DATABASE_URL: ${DATABASE_URL_OWNER}

  api:
    <<: *image-base
    image: ${IMAGE_PREFIX}/app-api:${APP_VERSION}
    env_file: .env
    environment:
      NODE_ENV: production
      STORAGE_DIR: /data/uploads
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MENU_INTERNAL_URL: http://menu:3000
      # Caddy, from inside app_net, sets X-Forwarded-For (real client IP for the limits).
      TRUST_PROXY: 172.30.0.0/24
    volumes:
      - /mnt/dados/uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3333/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    <<: *image-base
    image: ${IMAGE_PREFIX}/app-web:${APP_VERSION}
    depends_on: [api]

  menu:
    <<: *image-base
    image: ${IMAGE_PREFIX}/app-menu:${APP_VERSION}
    environment:
      API_INTERNAL_URL: http://api:3333
      MENU_PUBLIC_URL: https://cardapio.${BASE_DOMAIN}
      MENU_REVALIDATE_SECRET: ${MENU_REVALIDATE_SECRET}
    depends_on: [api]

  admin:
    <<: *image-base
    image: ${IMAGE_PREFIX}/app-admin:${APP_VERSION}
    depends_on: [api]

  redis:
    <<: *image-base
    image: redis:8-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  caddy:
    <<: *image-base
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      DOZZLE_USER: ${DOZZLE_USER}
      DOZZLE_PASSWORD_HASH: ${DOZZLE_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web, menu, admin]

  # Container logs at logs.<base>, behind the password checked by Caddy.
  dozzle:
    <<: *image-base
    image: amir20/dozzle:v8
    environment:
      DOZZLE_NO_ANALYTICS: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  app_net:
    external: true

volumes:
  redis-data:
  caddy-data:
  caddy-config:
