packages:
  - apps/*
  - packages/*

autoInstallPeers: true
strictPeerDependencies: false

# Packages allowed to run install scripts (native binaries / codegen).
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  msgpackr-extract: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@scarf/scarf': false
  # firebase-admin (D050): postinstall scripts not needed to send messages.
  '@firebase/util': false
  protobufjs: false
# pnpm only installs versions published at least 1 day ago (minimumReleaseAge, 1440 min by default).
# These exact Expo SDK 58 versions are the ones `expo install` requires for apps/courier and were
# published on 2026-10-15/16 (D050). Only exact versions, never ranges or package names.
# Remove this list after 2026-10-17 07:00 UTC, when all of them pass the limit (see docs/ROADMAP.md).
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.10'
  - '@expo/metro-config@58.0.14'
  - '@expo/package-manager@1.14.2'
  - '@expo/prebuild-config@58.0.14'
  - '@expo/router-server@58.0.14'
  - babel-preset-expo@58.0.16
  - expo-asset@58.0.16
  - expo-modules-core@58.0.20
  - expo-modules-jsi@58.0.14
  - expo@58.0.12
  - expo-task-manager@58.0.12
  - expo-system-ui@58.0.6

# Few parallel install scripts: this machine has little commit memory.
childConcurrency: 2

# Single socket.io version (the Nest adapter and the API must share the same types).
overrides:
  socket.io: 4.8.4
