packages:
  - apps/*
  - packages/*

autoInstallPeers: true
strictPeerDependencies: false

# Packages allowed to run install scripts (native binaries / codegen).
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  msgpackr-extract: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@scarf/scarf': false
minimumReleaseAgeExclude:
  - lucide-react@1.52.0

# Few parallel install scripts: this machine has little commit memory.
childConcurrency: 2
