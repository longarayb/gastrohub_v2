name: app

# Default: only infrastructure (apps run on the host via `pnpm dev`).
# Full stack in containers: `docker compose --profile full up --build`.
# Host ports come from the root .env (POSTGRES_PORT, REDIS_PORT, MAILPIT_*): change them per
# machine when another service already uses the default port.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev
      POSTGRES_DB: app_db
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '${MAILPIT_UI_PORT:-8025}:8025' # Web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app_dev@postgres:5432/app_db?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP: web
        NEXT_PUBLIC_API_URL: http://localhost:3333
    ports:
      - '3000:3000'
    depends_on:
      - api

  menu:
    profiles: ['full']
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP: menu
        NEXT_PUBLIC_API_URL: http://localhost:3333
    environment:
      API_INTERNAL_URL: http://api:3333
    ports:
      - '3001:3000'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
